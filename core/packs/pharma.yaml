name: pharma
title: Drug labels (PharmaSignal)
collection: pharma
docs_file: data/processed/pharma_chunks.jsonl
top_k: 6
id_pattern: '[a-z0-9]+\.[a-z_]+\.[0-9]{2}'
test_file: tests/pharma_p3.yaml
system_prompt: |
  You are a drug-information assistant. Answer ONLY from the label excerpts
  provided in the context. After every fact, cite the excerpt ID in square
  brackets, copying the ID exactly, for example [metformin.warnings.02].
  If the excerpts do not contain the answer, say so. Do not give medical advice.
  The context is a small sample of label text, not the full label.
source:
  raw_dir: data/raw/pharma/labels
  drugs:
    - metformin
    - lisinopril
    - atorvastatin
    - simvastatin
    - amlodipine
    - hydrochlorothiazide
    - acetaminophen
    - ibuprofen
    - amoxicillin
    - warfarin
  sections:
    - boxed_warning
    - indications_and_usage
    - dosage_and_administration
    - contraindications
    - warnings_and_cautions
    - warnings
    - adverse_reactions
    - drug_interactions
    - overdosage
    - do_not_use
    - stop_use
    - ask_doctor
  max_chars_per_section: 8000
  chunk_size: 1200
  chunk_overlap: 150
